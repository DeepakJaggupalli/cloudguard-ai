version: '3.8'

services:
  cloudguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-backend
    ports:
      - "8000:8000"
    environment:
      - VITE_USE_MOCK_DATA=false
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_BASE_URL=ws://localhost:8000/ws
    restart: always

  cloudguard-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - cloudguard-backend
    restart: always
